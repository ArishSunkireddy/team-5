name: Team 5 CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  schedule:
    # Weekly dependency audit (Mondays 14:00 UTC)
    - cron: "0 14 * * 1"
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded runs on the same branch/PR so pushes don't pile up.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # engines requires ^22.12 || >=24, so track the latest 22.x
  NODE_VERSION: "22.x"
  # `npm ci` runs the "prepare" script, which installs the local pre-push hook. Not wanted in CI.
  HUSKY: "0"

jobs:
  lockfile:
    # Fast guard for the failures that burned past PRs: out-of-sync lockfile, missing Linux
    # native binaries (Tailwind/rolldown), extra per-game lockfiles. Runs in seconds, no install.
    name: lockfile
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Lockfile checks
        run: node scripts/check-lockfile.mjs
      - name: package.json and lockfile are in sync
        run: npm ci --dry-run --ignore-scripts

  spelling:
    name: spelling
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: crate-ci/typos@v1.52.2

  lint:
    name: lint
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: oxlint
        run: npm run lint

  format:
    # Advisory only: the codebase has never been run through oxfmt, so enforcing
    # this would force one repo-wide reformat. Flip continue-on-error off after that.
    name: format (advisory)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: oxfmt --check
        run: npm run format:check

  typecheck:
    name: typecheck
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: tsc --noEmit (all six games)
        run: npm run typecheck

  test:
    name: test
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Vitest with coverage (fails under thresholds in vitest.config.ts)
        run: npm run test:coverage
      - name: Coverage summary
        if: always()
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            node -e '
              const t = require("./coverage/coverage-summary.json").total;
              const row = (k) => `| ${k} | ${t[k].pct}% | ${t[k].covered}/${t[k].total} |`;
              console.log("### Coverage\n\n| Metric | % | Covered |\n|---|---|---|");
              for (const k of ["statements","branches","functions","lines"]) console.log(row(k));
            ' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore
          retention-days: 7

  build:
    name: build
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Build all games
        run: npm run build
      - name: Every workspace produced dist/index.html
        run: |
          node -e '
            const fs = require("fs");
            const missing = require("./package.json").workspaces.filter((w) => !fs.existsSync(`${w}/dist/index.html`));
            if (missing.length) { console.error("No dist/index.html for: " + missing.join(", ")); process.exit(1); }
            console.log("All workspaces built an index.html");
          '
      - name: Upload build output
        uses: actions/upload-artifact@v7
        with:
          name: game-builds
          path: |
            */dist/
            !**/node_modules/**
          if-no-files-found: error
          retention-days: 7

  e2e:
    # Opens every built game in a real Chromium and checks it starts with no errors.
    name: e2e (smoke)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Build and run smoke tests
        run: npm run test:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  security:
    name: security (npm audit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Non-blocking for now; remove continue-on-error once the tree stays clean.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: npm audit (high and above)
        run: npm audit --audit-level=high
