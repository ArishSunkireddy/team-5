name: Team 5 CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Run Test Suite
        run: npm test

      - name: Typecheck Games
        run: npx tsc --noEmit -p edgar-allan-poe && npx tsc --noEmit -p shakespeare && npm run typecheck -w iambic-pentameter

      - name: Build Games
        run: npm run build
